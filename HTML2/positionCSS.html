<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 300px;
            margin: 20px;
            border-radius: 30px;
            position: relative;
            background-color: white;
        }

        .top {
            width: 100%;
            height: 200px;
            background-color: red;
            border-radius: 30px;
        }

        .bottom {
            text-align: center;
            padding: 50px;
            padding-top: 30px;
            padding-bottom: 20px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .position {
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .Desc {
            font-size: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            color: rgb(65, 65, 65);
        }

        body {
            background-color: gray;
        }

        .profile {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            position: absolute;
            top: 140px;
            right: 110px;
            border: 3px solid white;

        }

        .social {
            width: 30px;
            height: 30px;
            object-fit: cover;
            margin-top: 10px;

        }
    </style>
</head>

<body>
    <div class="card">
        <img class="profile" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhQTcjdy8mzrojK530Aea0anTaZcXyHrf7Q5ga6lVsUw&s=10" alt="">
        <div class="top"></div>
        <div class="bottom">
            <p class="name">Phatt Sovannheng</p>
            <p class="position">Web Developer</p>
            <hr style="border: 1px solid rgb(207,6,6)">
            <p class="Desc">As a web developer, I am passionate about
                creating innovative and user-friendly web applications.  My expertise lies in utilizing the latest technologies and frameworks to build
                responsive and visually appealing websites. </p>

            </p>
            <div>
                <img class="social" src="https://img.icons8.com/?size=100&id=BrU2BBoRXiWq&format=png&color=000000"
                    alt="">
                <img class="social" src="https://img.icons8.com/?size=100&id=63306&format=png&color=000000" alt="">
                <img class="social" src="https://img.icons8.com/?size=100&id=uLWV5A9vXIPu&format=png&color=000000"
                    alt="">
            </div>
        </div>

    </div>
</body>

</html>
