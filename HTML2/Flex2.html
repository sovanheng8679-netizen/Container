<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus Showroom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            background-image: url('https://i.pinimg.com/1200x/bf/53/80/bf53804eb89de119a8654b875e3f7ad4.jpg');
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            background-blend-mode: darken;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .card {
            color: white;
            border-radius: 16px;
            width: 320px;
            height: 420px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Subtle hover animation for a premium feel */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
        }

        .image-container {
            width: 100%;
            height: 200px;
            /* Gives the car space to be the hero element */
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Crucial: ensures images crop beautifully instead of squishing */
            object-position: center 78%;
        }

        .text-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            /* Darkens the text area slightly for crisp readability */
        }

        .info h2 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .info .year {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 4px;
        }

        .info .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .text-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #ffffff;
            color: #000000;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .text-container button:hover {
            background-color: #e2e2e2;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <div class="image-container">
                <img src="https://i.pinimg.com/736x/33/b9/62/33b96229c40a671e1962cadc1a2afd75.jpg"
                    alt="Lexus RX350 F-SPORT">
            </div>
            <div class="text-container">
                <div class="info">
                    <h2>Lexus RX350 F-SPORT</h2>
                    <p class="year">2023</p>
                    <p class="price">$50,XXX</p>
                </div>
                <button>Buy Now</button>
            </div>
        </div>

        <div class="card">
            <div class="image-container">
                <img src="https://i.pinimg.com/1200x/7d/30/ad/7d30ad3299c7b253611e31a94f3fc768.jpg"
                    alt="Lexus RX500h F-SPORT">
            </div>
            <div class="text-container">
                <div class="info">
                    <h2>Lexus RX500h F-SPORT</h2>
                    <p class="year">2023</p>
                    <p class="price">$11X,XXX</p>
                </div>
                <button>Buy Now</button>
            </div>
        </div>

    </div>

</body>

</html>
