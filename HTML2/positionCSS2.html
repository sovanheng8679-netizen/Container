<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 680px;
            margin: 20px;
            border-radius: 18px;
            position: relative;
            background: #b9e2e3;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .cover {
            height: 220px;
            background: #3d78bb;
            position: relative;
        }

        .profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
            bottom: -70px;
            left: 20px;
            object-fit: cover;
            border: 8px solid #b9e2e3;

        }

        .Follow-btn {
            position: absolute;
            right: 60px;
            bottom: -15px;
            padding: 10px 35px;
            background: #1f1578;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            padding: 90px 60px 40px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .username {

            color: gray;

            font-size: 28px;

            margin-top: 5px;
        }

        .bio {

            margin-top: 35px;

            font-size: 17px;

            font-weight: bold;

            line-height: 1.5;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            font-size: 18px;
            color: #61878b;
            margin-bottom: 20px;
        }

        .stat-count {
            color: #000;
            font-weight: bold;
        }

        .profile-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-icon {
            transform: rotate(-45deg);
            display: inline-block;

        }

        .profile-link a {
            text-decoration: none;
            color: #000;
            font-size: 18px;
        }

        .profile-link a:hover {
            text-decoration: underline;
        }

        .verify-blue {
            color: #1d9bf0;
            font-size: 22px;
            display: inline-block;
        

        }
    </style>
</head>

<body>
    <div class="card">
        <div class="cover">
            <img class="profile"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhIm3TSSEF02jav2K7Ktnscbx7g5HI1mKHYThwDzFxuabXEthgTRgADNM&s=10"
                alt="">
            <button class="Follow-btn">
                Follow
            </button>

        </div>
        <div class="content">
            <h2 class="name">Liverpool FC
                <i class="fa-solid fa-circle-check verify-blue"></i>
            </h2>
            <p class="username">Liverpool Football Club</p>
            <p class="bio">
                Official account of Liverpool Football Club. 🔴 Our 26/27 adidas home kit is now available. 😮‍💨
            </p>

            <div class="profile-stats">
                <span class="stat-item"><strong class="stat-count">000</strong>Following</span>
                <span class="stat-item"><strong class="stat-count">000.0k</strong>Followers</span>
            </div>
            <div class="profile-link">
                <span class="link-icon"><img src="https://img.icons8.com/?size=100&id=undefined&format=png&color=000000"
                        alt=""></span>
                <a href="https://liverpool.com" target="_blank">liverpool.com</a>

            </div>

        </div>

    </div>
</body>

</html>
