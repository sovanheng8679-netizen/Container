<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .card {
            width: 270px;
            border: 1px solid rgb(234, 234, 234);
            margin: 20px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgb(234, 234, 234);
        }

        .top {
            width: 100%;
            height: 190px;
            background-color: grey;
            Border-radius: 10px;
        }

        .card-body {
            margin-top: 10px;
        }

        .name {
            font-weight: 600;
            font-size: 20px;
        }

        .price {
            margin-top: 10px;
            color: rgb(42, 42, 42);

        }

        .btn {
            margin-top: 10px;
            padding: 7px 10px;
            background-color: rgb(76, 76, 250);
            color: white;
            border: none;
            border-radius: 5px;
        }

        .img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="top">
            <img class="img" src="https://www.electrive.com/media/2024/10/changan-deepal-s05-2024-05-min.jpg" alt="">
        </div>
        <div class="card-body">
            <p class="name">Deepal S05</p>
            <p class="price">$29XXX</p>
            <button class="btn">Add to Cart</button>
            </div>

        </div>

  
</body>

</html>
