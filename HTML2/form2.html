<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <h2>Student Registration</h2>
        <label for="full name">Full Name:</label><br/>
        <input id="full name"type="text" placeholder="Enter your full name" /> <br/><br/>

        <label for="username">Username:</label><br/>
        <input id="username"type="text" placeholder="Enter username"/> <br/><br/>

        <label for="password">Password:</label><br/>
        <input id="password"type="text" placeholder="Enter password"><br/><br/>

        <label for="email">Email:</label><br/>
        <input id="email"type="text" placeholder="Enter email"><br/><br/>

        <label for="age">Age:</label><br/>
        <input id="age"type="text" placeholder="Enter age"><br/><br/>

        <label for="phone">Phone:</label><br/>
        <input id="phone"type="text" placeholder="Enter phone number"><br/><br/>

        <button>Sign Up</button>
        <button>Clear</button>


    </form>
</body>
</html>
