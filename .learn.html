<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>
        <marquee behavior="alternate" direction="right" scrollamount="10">Hello, World!
        </marquee>

        <img width="300px" height="300px"
            src="https://www.lambocars.com/wp-content/uploads/2021/07/2021-goodwood-fos-lamborghini-12.jpg" alt="Lambo">
    </p>
</body>

</html>

marquee is the running text in the webpage.
<!-- img is the tag to insert image in webpage. src is the attribute to give the path of the image. alt is the attribute to give the alternate text if the image is not found. width is the attribute to give the width of the image. -->
